<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shadow and box shadows</title>
    <style>
        h1{
             text-shadow:3px 3px 5px red,3px -3px 5px rgb(110, 50, 159);
        }
        #box1{
        width: 100px;
        height: 100px;
        background-color: white;
        box-shadow:3px 3px 5px ;
         }
    </style>
</head>
<body>
    <h1>First Page</h1>
    <div id="box1"></div>
</body>
</html>
